<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>Suivi chantier</title>
  <!-- Application installable : nom, icônes, ouverture en plein écran -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="stylesheet" href="css/charte.css?v=16">
  <link rel="stylesheet" href="css/style.css?v=16">
</head>
<body>

  <!-- Écran 1 : liste des projets -->
  <section id="ecranProjets" class="ecran">
    <header>
      <h1>Projets</h1>
      <div class="actions">
        <!-- Visible seulement quand Chrome permet d'installer l'application -->
        <button id="installer" class="bouton secondaire" hidden>installer</button>
        <label class="bouton">
          Importer
          <input type="file" id="choixZip" accept=".zip,application/zip,application/x-zip-compressed" hidden>
        </label>
        <button id="nouveauProjet" class="bouton">Nouveau projet</button>
      </div>
    </header>
    <ul id="listeProjets" class="liste"></ul>
  </section>

  <!-- Écran 2 : un projet et ses plans -->
  <section id="ecranProjet" class="ecran" hidden>
    <header>
      <button id="retourProjets" class="bouton" aria-label="Retour aux projets"><svg class="fleche" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12H3M12 3l-9 9 9 9"/></svg></button>
      <h1 id="titreProjet"></h1>
      <div class="actions">
        <button id="ouvrirLocaux" class="bouton secondaire">locaux</button>
        <label class="bouton">
          Ajouter un plan
          <input type="file" id="choixPdf" accept="application/pdf" hidden>
        </label>
      </div>
    </header>
    <ul id="listePlans" class="liste"></ul>
  </section>

  <!-- Écran Locaux : niveaux et locaux du projet, importés depuis un fichier CSV -->
  <section id="ecranLocaux" class="ecran" hidden>
    <header>
      <button id="retourProjetLocaux" class="bouton" aria-label="Retour au projet"><svg class="fleche" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12H3M12 3l-9 9 9 9"/></svg></button>
      <h1 id="titreLocaux">Locaux</h1>
      <div class="actions">
        <label class="bouton">
          importer CSV
          <!-- Plusieurs types : Android ne reconnaît pas toujours un .csv sous le même nom -->
          <input type="file" id="choixCsv" accept=".csv,text/csv,text/comma-separated-values,text/plain,application/vnd.ms-excel" hidden>
        </label>
      </div>
    </header>
    <ul id="listeLocaux" class="liste"></ul>
  </section>

  <!-- Écran 3 : un plan et ses remarques -->
  <section id="ecranPlan" class="ecran" hidden>
    <header>
      <button id="retourProjet" class="bouton" aria-label="Retour au projet"><svg class="fleche" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12H3M12 3l-9 9 9 9"/></svg></button>
      <h1 id="titrePlan"></h1>
      <div class="actions">
        <button id="recadrer" class="bouton">Recadrer</button>
      </div>
    </header>
    <main id="cadrePlan">
      <div id="contenuPlan">
        <canvas id="canevasPlan"></canvas>
      </div>
    </main>
  </section>

  <!-- Fiche remarque -->
  <dialog id="fiche">
    <form method="dialog">
      <h2 id="titreFiche">Remarque</h2>

      <label><span class="etiquette">description</span>
        <textarea id="champTexte" rows="4" required></textarea>
      </label>

      <!-- Grille à deux colonnes : étiquettes à gauche (toutes à la largeur de la plus longue),
           champs à droite sur la même ligne ; les photos s'affichent sous leur étiquette -->
      <div class="grilleFiche">
        <label><span class="etiquette">statut</span>
          <select id="champStatut">
            <option value="ouverte">Ouverte</option>
            <option value="levee">Levée</option>
          </select>
        </label>

        <label><span class="etiquette">chapitre</span>
          <input id="champEntreprise" type="text">
        </label>

        <label><span class="etiquette">date</span>
          <input id="champDate" type="date">
        </label>

        <div class="champPhotos">
          <span class="etiquette">photos</span>
          <div id="vignettes" class="vignettes"></div>
          <div class="actions">
            <button type="button" id="prendrePhoto" class="bouton secondaire">prendre une photo</button>
            <button type="button" id="ajouterPhoto" class="bouton secondaire">galerie</button>
          </div>
          <!-- « capture » ouvre directement l'appareil photo (le sélecteur d'Android ne le propose plus) -->
          <input type="file" id="appareilPhoto" accept="image/*" capture="environment" hidden>
          <input type="file" id="choixPhoto" accept="image/*" hidden>
        </div>
      </div>

      <div class="boutonsFiche">
        <button value="enregistrer" class="principal">Enregistrer</button>
        <button value="annuler" formnovalidate>Annuler</button>
        <button value="supprimer" id="boutonSupprimer" formnovalidate class="danger">Supprimer</button>
      </div>
    </form>
  </dialog>

  <!-- Annotation d'une photo : trait rouge au doigt -->
  <dialog id="editeurPhoto">
    <header>
      <button type="button" id="supprimerPhoto" class="bouton danger">supprimer</button>
      <div class="actions">
        <button type="button" id="annulerTrait" class="bouton">annuler le trait</button>
        <button type="button" id="fermerEditeur" class="bouton">terminé</button>
      </div>
    </header>
    <div id="cadrePhoto">
      <canvas id="canevasPhoto"></canvas>
    </div>
  </dialog>

  <!-- Nouvelle version de l'application reçue en arrière-plan (voir sw.js) -->
  <div id="bandeauMiseAJour" class="bandeau" hidden>
    <span>Nouvelle version disponible</span>
    <button type="button" id="recharger" class="bouton">recharger</button>
  </div>

  <script type="module" src="js/app.js?v=16"></script>
</body>
</html>
