<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Suivi chantier</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Suivi chantier</h1>
    <div class="actions">
      <button id="recadrer" class="bouton">Recadrer</button>
      <label class="bouton">
        Ouvrir un plan
        <input type="file" id="choixPdf" accept="application/pdf" hidden>
      </label>
    </div>
  </header>

  <main id="cadrePlan">
    <div id="contenuPlan">
      <canvas id="canevasPlan"></canvas>
    </div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
