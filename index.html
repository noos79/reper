<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>Suivi chantier</title>
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
  <header>
    <h1>Suivi chantier</h1>
    <div class="actions">
      <button id="recadrer" class="bouton">Recadrer</button>
      <label class="bouton">
        Ouvrir un plan
        <input type="file" id="choixPdf" accept="application/pdf" hidden>
      </label>
    </div>
  </header>

  <main id="cadrePlan">
    <div id="contenuPlan">
      <canvas id="canevasPlan"></canvas>
    </div>
  </main>

    <dialog id="fiche">
    <form method="dialog">
      <h2 id="titreFiche">Remarque</h2>

      <label>Description
        <textarea id="champTexte" rows="4" required></textarea>
      </label>

      <label>Statut
        <select id="champStatut">
          <option value="ouverte">Ouverte</option>
          <option value="levee">Levée</option>
        </select>
      </label>

      <label>Entreprise / lot
        <input id="champEntreprise" type="text">
      </label>

      <label>Date de constat
        <input id="champDate" type="date">
      </label>

      <div class="boutonsFiche">
        <button value="enregistrer" class="principal">Enregistrer</button>
        <button value="annuler" formnovalidate>Annuler</button>
        <button value="supprimer" id="boutonSupprimer" formnovalidate class="danger">Supprimer</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/app.js?v=3"></script>
</body>
</html>
